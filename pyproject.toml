[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corporate-omissions"
version = "0.1.0"
description = "MNAR emissions disclosure pipeline (Trucost + fundamentals + exponential tilting adjustment)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Giulia Crippa" }]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "statsmodels",
  "scikit-learn",
  "matplotlib",
  "seaborn",
  "pyarrow",
  "tqdm",
  "pyyaml",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
